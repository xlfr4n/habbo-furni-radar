name: Radar Heartbeat

on:
  schedule:
    - cron: "17 3 */15 * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: habbo-furni-radar-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update heartbeat
        run: |
          mkdir -p state
          printf '%s\n' '{"heartbeat_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > state/heartbeat.json

          if [[ -z "$(git status --porcelain -- state/heartbeat.json)" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/heartbeat.json
          git commit -m "chore: radar heartbeat [skip ci]"
          git push
