name: Test Discord Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Send latest 10 furni
        env:
          DISCORD_WEBHOOK_URL: \${{ secrets.DISCORD_WEBHOOK_URL }}
          HABBO_FURNIDATA_URL: https://www.habbo.es/gamedata/furnidata_xml/1
        run: python scripts/test_discord.py
