name: Habbo Furni Radar

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: habbo-furni-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check official Collectibles Shop
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python radar.py

      - name: Commit updated radar state
        run: |
          if [[ -z "$(git status --porcelain -- state/known_shop_items.json)" ]]; then
            echo "No hay cambios de estado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/known_shop_items.json
          git commit -m "chore: update shop radar state [skip ci]"
          git push
