version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      xLFr4n-maintenance:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "automated"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      xLFr4n-maintenance:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "automated"
